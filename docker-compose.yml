version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5432:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data

  # Redis нужен только для pub/sub между несколькими репликами приложения.
  # Если запускаете один инстанс — можно закомментировать этот сервис
  # и убрать REDIS_ADDR у app.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: "postgres://postgres:0000@localhost:5432/chat?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      RATE_LIMIT_RPS: "5"
      RATE_LIMIT_BURST: "10"
      HISTORY_LIMIT: "50"
      SHUTDOWN_TIMEOUT_SEC: "10"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

volumes:
  pgdata: